name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check that every path can be checked out on Windows and macOS
        # No paths that differ only in case, no names Windows cannot create.
        run: git ls-files -z | python .github/scripts/check_portable_paths.py

      - name: Compile every tracked Python file
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Check for duplicate definitions
        # Catches conflict resolutions that kept both sides: the file still
        # compiles, but the later definition silently replaces the earlier one.
        run: git ls-files -z '*.py' | xargs -0 python .github/scripts/check_duplicate_definitions.py

      - name: Build ouroboros_sync from rust_modules/
        # The tests then run against this build of the Rust source instead of
        # the committed ouroboros_sync.so (which needs Python 3.12+).
        # pyo3 0.20 predates Python 3.13; its stable-ABI fallback covers it.
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: bash build_ouroboros_sync.sh

      - name: Install test dependencies
        # The core needs only the standard library; the quantum profiles need
        # numpy, and scikit-learn exercises the ML addon's sklearn integration.
        run: python -m pip install "numpy>=1.24,<3" "scikit-learn>=1.3,<2" "pytest>=8,<9"

      - name: Run tests
        run: python -m pytest -q -rs
